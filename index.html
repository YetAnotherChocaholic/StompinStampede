<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta property="og:title" content="Stompin Stampede">

  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="#home" data-tab-link="home">
      <img src="logo.jpg" alt="" width="40" height="40">
      <span>Stompin Stampede</span>
    </a>
    <div class="top-links">
      <a class="fb-btn contact-btn" id="email-top" href="#" aria-label="Email us">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zm0 2v.4l8 5 8-5V7H4zm16 2.8-7.5 4.7a1 1 0 0 1-1 0L4 9.8V17h16V9.8z"/></svg>
        <span>Email</span>
      </a>
      <a class="fb-btn contact-btn" id="phone-top" href="#" aria-label="Call us">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg>
        <span>Call</span>
      </a>
      <a class="fb-btn" id="fb-top" href="#" target="_blank" rel="noopener" aria-label="Facebook page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.6c0-.9.3-1.5 1.5-1.5h1.5V4.4c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.4H8v3h2.6V21h2.9z"/></svg>
        <span>Facebook</span>
      </a>
      <a class="fb-btn ig-btn" data-instagram href="#" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm4.9-8.95a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2zM12 2.5c-2.6 0-2.9 0-3.9.06-3.5.16-5.4 2-5.55 5.55C2.5 9.1 2.5 9.4 2.5 12s0 2.9.06 3.9c.16 3.5 2 5.4 5.55 5.55 1 .05 1.3.06 3.9.06s2.9 0 3.9-.06c3.5-.16 5.4-2 5.55-5.55.05-1 .06-1.3.06-3.9s0-2.9-.06-3.9c-.16-3.5-2-5.4-5.55-5.55C14.9 2.5 14.6 2.5 12 2.5zm0 1.7c2.55 0 2.85 0 3.85.06 2.6.12 3.8 1.35 3.9 3.9.05 1 .06 1.3.06 3.85s0 2.85-.06 3.85c-.12 2.55-1.3 3.78-3.9 3.9-1 .05-1.3.06-3.85.06s-2.85 0-3.85-.06c-2.6-.12-3.78-1.35-3.9-3.9C4.2 14.85 4.2 14.55 4.2 12s0-2.85.06-3.85c.12-2.56 1.32-3.78 3.9-3.9 1-.05 1.3-.06 3.84-.06z"/></svg>
        <span>Instagram</span>
      </a>
      <a class="fb-btn tt-btn" data-tiktok href="#" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 2.5h-3.3v12.9a2.85 2.85 0 1 1-2.85-2.85c.3 0 .58.05.85.13V9.3a6.2 6.2 0 1 0 5.3 6.1V8.9a7.9 7.9 0 0 0 4.4 1.35V6.9a4.5 4.5 0 0 1-4.4-4.4z"/></svg>
        <span>TikTok</span>
      </a>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <div class="tabs-inner" role="tablist">
      <button role="tab" data-tab="home">Home</button>
      <!---<button role="tab" data-tab="details">Event Details</button>--->
      <!---<button role="tab" data-tab="schedule">Schedule</button>--->
      <!---<button role="tab" data-tab="competition">Competition</button>--->
      <!---<button role="tab" data-tab="registration">Registration</button>--->
      <!---<button role="tab" data-tab="venue">Venue</button>--->
      <!---<button role="tab" data-tab="faq">FAQ</button>--->
      <button role="tab" data-tab="contact">Contact</button>
    </div>
  </nav>

  <main>
    <!-- HOME -->
    <section id="home" role="tabpanel" class="panel">
      <div class="hero">
        <img class="hero-logo" src="logo.jpg" alt="Stompin Stampede logo" width="1254" height="1254">
        <div class="hero-text">
          <p class="eyebrow" data-field="tagline"></p>
          <h1 data-field="eventName"></h1>
          <!---<p class="hero-meta">
            <span data-field="dateText"></span>
            <span class="dot" aria-hidden="true">★</span>
            <span data-field="city"></span>
          </p>--->
          <div class="countdown" id="countdown" hidden></div>
          <div class="cta-row">
            <!--<a class="btn btn-gold" data-register target="_blank" rel="noopener">Register Now</a>--->
            <!---<a class="btn btn-ghost" data-facebook target="_blank" rel="noopener">Follow on Facebook</a>--->
          </div>
        </div>
      </div>
      <p class="lead" data-field="welcome"></p> 
      <!---<div class="cards" id="highlights"></div>-->
      <!---<div id="announcements-wrap">
        <h2>Announcements</h2>
        <ul class="news" id="announcements"></ul>
      </div>--->
    </section>

    <!-- DETAILS -->
    <section id="details" role="tabpanel" class="panel" hidden>
      <h2>Event Details</h2>
      <p class="lead" data-field="about"></p>
      <dl class="facts" id="facts"></dl>
    </section>

    <!-- SCHEDULE -->
    <section id="schedule" role="tabpanel" class="panel" hidden>
      <h2>Schedule</h2>
      <div class="days" id="days"></div>
    </section>

    <!-- COMPETITION -->
    <section id="competition" role="tabpanel" class="panel" hidden>
      <h2>Divisions</h2>
      <div class="cards" id="divisions"></div>
      <h2>Rules &amp; Judging</h2>
      <ul class="checklist" id="rules"></ul>
    </section>

    <!-- REGISTRATION -->
    <section id="registration" role="tabpanel" class="panel" hidden>
      <h2>Registration</h2>
      <p class="lead" data-field="registrationNote"></p>
      <div class="split">
        <div class="box">
          <h3>Fees</h3>
          <table class="table" id="fees"></table>
        </div>
        <div class="box">
          <h3>Key Dates</h3>
          <table class="table" id="deadlines"></table>
        </div>
      </div>
      <a class="btn btn-gold" data-register target="_blank" rel="noopener">Register Now</a>
    </section>

    <!-- VENUE -->
    <section id="venue" role="tabpanel" class="panel" hidden>
      <h2 data-field="venueName"></h2>
      <p class="address" data-field="venueAddress"></p>
      <p class="lead" data-field="venueNotes"></p>
      <div class="map" id="map" hidden></div>
      <div id="hotels-wrap">
        <h2>Where to Stay</h2>
        <div class="cards" id="hotels"></div>
      </div>
    </section>

    <!-- FAQ -->
    <section id="faq" role="tabpanel" class="panel" hidden>
      <h2>Frequently Asked Questions</h2>
      <div class="faq" id="faq-list"></div>
    </section>

    <!-- CONTACT -->
    <section id="contact" role="tabpanel" class="panel" hidden>
      <h2>Contact Us</h2>
      <p class="lead" data-field="contactNote"></p>
      <div class="cards" id="contact-cards"></div>
    </section>
  </main>

  <footer class="footer">
    <img src="logo.jpg" alt="" width="56" height="56">
    <p><strong data-field="eventName"></strong><!--- · <span data-field="dateText"></span>---></p>
    <p class="footer-links">
      <a class="fb-link" data-facebook target="_blank" rel="noopener">Find us on Facebook</a>
      <a data-instagram target="_blank" rel="noopener">Instagram</a>
      <a data-tiktok target="_blank" rel="noopener">TikTok</a>
    </p>
  </footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
